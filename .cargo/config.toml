# WordWise 项目级 Cargo 配置
#
# 这里解决的问题：
#   indexmap 1.9.x 的 build script 用 autocfg 探测 sysroot 中是否存在 std，
#   在部分环境（受限的 rustup 安装 / 非标准 sysroot）下探测会失败，于是
#   indexmap 被编译成 no_std 版本 —— IndexMap 变成 `<K, V, S>` 三个泛型参数。
#   这会连锁导致 schemars 0.8.22 的 `pub type Map<K, V> = IndexMap<K, V>;`
#   报 E0107。而 tauri-utils 2.x 硬性锁定 schemars =0.8.22，无法升级规避。
#
#   直接注入 `has_std` cfg，让 indexmap 走 std 分支：
#     #[cfg(has_std)]
#     pub struct IndexMap<K, V, S = RandomState> { ... }
#   泛型参数带默认值后，`IndexMap<K, V>` 就能正常编译。
#
# 该 cfg 对不相关 crate 无副作用（rustc 忽略未知 cfg 名称，且已用
# check-cfg 声明）。
#
# 若将来 indexmap / tauri 升级到不再需要此补丁的版本，可删除本文件。

[build]
rustflags = ["--cfg", "has_std"]
