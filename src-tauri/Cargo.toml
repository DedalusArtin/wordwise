[package]
name = "wordwise"
version = "0.45.7"
description = "WordWise - LM Studio 驱动的可视化背单词与 AI 讲解一体化桌面软件"
authors = ["DedalusArtin"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/DedalusArtin/wordwise"
default-run = "wordwise"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# indexmap 1.9 —— **本项目不直接使用它**，加这一行只是为了打开它的 `std` feature。
# （★ 必须在 [build-dependencies]，不能挪到 [dependencies]，原因见注释最后一段。）
#
# 不修会怎样：Android 构建报
#   error[E0107]: struct takes 3 generic arguments but 2 generic arguments were supplied
#     --> schemars-0.8.22/src/lib.rs:12:32
#     pub type Map<K, V> = indexmap::IndexMap<K, V>;
#
# 成因链：
#   1. schemars 0.8.22 里 Map 有两个定义：
#        #[cfg(not(feature = "preserve_order"))] Map = BTreeMap
#        #[cfg(feature = "preserve_order")]     Map = indexmap::IndexMap   ← 报错的是这条
#      tauri 2.x 会打开 preserve_order，所以躲不掉。
#   2. indexmap 1.9.x 的 IndexMap 也有两套定义：
#        #[cfg(has_std)]      pub struct IndexMap<K, V, S = RandomState>  ← Map<K,V> 能用
#        #[cfg(not(has_std))] pub struct IndexMap<K, V, S>               ← S 无默认值 → E0107
#   3. `has_std` 由 indexmap 自己的 build.rs 决定：
#        CARGO_FEATURE_STD 有值 → autocfg::emit("has_std")   ← 确定性，不做探测
#        否则                   → autocfg 探测 sysroot 里有没有 std
#   4. indexmap 1.9.3 的 [features] 里**没有** `default = ["std"]`，schemars 也没开它，
#      于是必然走探测那条不确定的路。
#
# 为什么探测会失败：autocfg 是把探测源码通过 **stdin 管道** 喂给 rustc 的
#   （autocfg/src/lib.rs 的 `probe_fmt`：`command.arg("-").stdin(Stdio::piped())`）。
# 在受限的进程环境（沙箱、句柄受限）下，带 stdin 管道的 spawn 会直接失败：
#   Os { code: 231, "All pipe instances are busy" }
# 探测于是恒为 false —— indexmap 被编成 no_std 版本，E0107 随之而来。
#
# 修法：显式打开 `std` feature，走上面那条确定性分支，彻底不依赖探测。
#
# ★ 为什么必须写在 [build-dependencies]：
#   schemars 是 `tauri-build` 的依赖，而 tauri-build 又是 tauri 的 build-dependency，
#   所以 schemars（连同它用的 indexmap）属于 **host 组**。
#   resolver v2 下 host 组与 target 组的 feature **不合并** —— 写进 [dependencies]
#   只影响交叉编译时 target 组里那份 indexmap，救不了真正报错的 host 那份。
#
# 注：项目级 `.cargo/config.toml` 里另有一份 `--cfg has_std` 注入。实测它对
#   **本地**构建有效（桌面端因此一直没暴露本问题），但跨编译时 `[build] rustflags`
#   不作用于 host 单元，对 Android 无效 —— 所以它替代不了本行。
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP 客户端（联网查词 / LM Studio 调用）
#
# 关于 `system-proxy` / `socks`：
#   ★ `default-features = false` 本身就会关掉 reqwest 的代理能力，
#     所以下面**显式**把 `system-proxy` 加回来：它让 reqwest 能读 Windows
#     注册表（Clash / v2ray 的「系统代理」就写在那里）以及代理环境变量。
#     缺少它，应用会静默直连 GitHub raw / wiktionary 并全部超时 ——
#     表现为「明明开了代理，却仍提示网络问题」。
#   ★ 代价：启用该特性后 reqwest 会**自己**去探测环境变量 / 注册表。
#     因此 `NetworkConfig.enable_proxy == false` 的直连分支**必须显式
#     `.no_proxy()`**（见 `net.rs::build_client_with`），否则「默认直连」
#     这个总开关会被 reqwest 悄悄绕过。
#   `socks` 用于支持 socks5:// 形式的代理地址。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "gzip",
    "brotli",
    "stream",
    "charset",
    "http2",
    "system-proxy",
    "socks",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"

# 本地存储
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }

# 时间处理（记忆周期表 / 复习计划）
chrono = { version = "0.4", features = ["serde"] }

# 解压 llama.cpp 引擎包（本地大模型一键部署）
zip = { version = "2", default-features = false, features = ["deflate"] }

# 在线更新安装包的完整性校验（sha256）
#
# 为什么不省掉它：下载中断留下的残缺文件在 Windows 上照样能双击，
# 然后报一个和「下载失败」毫无关系的错误。下完立刻自己算一遍摘要，
# 才能把问题拦在启动安装程序之前。
sha2 = "0.10"

# 本地语音合成（TTS）的音频回传
#
# piper 生成的是 WAV 文件。这里没有把文件路径交给前端用 asset:// 去取，
# 而是直接 base64 塞进 IPC 返回 —— 因为数据目录在「便携模式」下会紧贴
# exe，而 asset 协议的 scope 只覆盖 APPDATA，那边取不到。一个单词的 WAV
# 约 40~90 KB，走 IPC 完全无压力。
base64 = "0.22"

# 工具库
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
dirs = "5"
log = "0.4"

[features]
# 生产构建默认不开启 devtools
default = []
custom-protocol = ["tauri/custom-protocol"]

# Windows 平台专用：读取「Internet 选项」里的系统代理设置。
# 图形界面启动的应用拿不到 HTTP_PROXY 环境变量，只能从注册表读，
# 这是「开了代理却依然网络不通」的根因所在。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lib]
name = "wordwise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
