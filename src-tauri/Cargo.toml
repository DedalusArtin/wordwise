[package]
name = "wordwise"
version = "0.41.0"
description = "WordWise - LM Studio 驱动的可视化背单词与 AI 讲解一体化桌面软件"
authors = ["DedalusArtin"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/DedalusArtin/wordwise"
default-run = "wordwise"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP 客户端（联网查词 / LM Studio 调用）
#
# 关于 `system-proxy` / `socks`：
#   ★ `default-features = false` 本身就会关掉 reqwest 的代理能力，
#     所以下面**显式**把 `system-proxy` 加回来：它让 reqwest 能读 Windows
#     注册表（Clash / v2ray 的「系统代理」就写在那里）以及代理环境变量。
#     缺少它，应用会静默直连 GitHub raw / wiktionary 并全部超时 ——
#     表现为「明明开了代理，却仍提示网络问题」。
#   ★ 代价：启用该特性后 reqwest 会**自己**去探测环境变量 / 注册表。
#     因此 `NetworkConfig.enable_proxy == false` 的直连分支**必须显式
#     `.no_proxy()`**（见 `net.rs::build_client_with`），否则「默认直连」
#     这个总开关会被 reqwest 悄悄绕过。
#   `socks` 用于支持 socks5:// 形式的代理地址。
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "gzip",
    "brotli",
    "stream",
    "charset",
    "http2",
    "system-proxy",
    "socks",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"

# 本地存储
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }

# 时间处理（记忆周期表 / 复习计划）
chrono = { version = "0.4", features = ["serde"] }

# 解压 llama.cpp 引擎包（本地大模型一键部署）
zip = { version = "2", default-features = false, features = ["deflate"] }

# 在线更新安装包的完整性校验（sha256）
#
# 为什么不省掉它：下载中断留下的残缺文件在 Windows 上照样能双击，
# 然后报一个和「下载失败」毫无关系的错误。下完立刻自己算一遍摘要，
# 才能把问题拦在启动安装程序之前。
sha2 = "0.10"

# 工具库
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
dirs = "5"
log = "0.4"

# 说明：indexmap / schemars 的构建兼容性问题通过项目级
# `.cargo/config.toml` 注入 `--cfg has_std` 解决，无需在此声明依赖。

[features]
# 生产构建默认不开启 devtools
default = []
custom-protocol = ["tauri/custom-protocol"]

# Windows 平台专用：读取「Internet 选项」里的系统代理设置。
# 图形界面启动的应用拿不到 HTTP_PROXY 环境变量，只能从注册表读，
# 这是「开了代理却依然网络不通」的根因所在。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lib]
name = "wordwise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
