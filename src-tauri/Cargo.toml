[package]
name = "wordwise"
version = "1.0.0"
description = "WordWise - LM Studio 驱动的可视化背单词与 AI 讲解一体化桌面软件"
authors = ["DedalusArtin"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/DedalusArtin/wordwise"
default-run = "wordwise"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP 客户端（联网查词 / LM Studio 调用）
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-native-roots",
    "gzip",
    "brotli",
    "stream",
    "charset",
    "http2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"

# 本地存储
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }

# 时间处理（记忆周期表 / 复习计划）
chrono = { version = "0.4", features = ["serde"] }

# 工具库
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
urlencoding = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
dirs = "5"
log = "0.4"

# 说明：indexmap / schemars 的构建兼容性问题通过项目级
# `.cargo/config.toml` 注入 `--cfg has_std` 解决，无需在此声明依赖。

[features]
# 生产构建默认不开启 devtools
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lib]
name = "wordwise_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
